name: Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full commit SHA on branch (must match the selected workflow revision)'
        type: string
        required: true
      version:
        description: 'Stable x.y.z version already present in the source'
        type: string
        required: true
      notes:
        description: 'Explicit Chinese and English release notes'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: marklite-stable-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      metadata: ${{ steps.source.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Freeze source and release metadata
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: node scripts/freeze-release.mjs
      - run: npm ci
      - run: npm run version:check
      - run: npm run check
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: darwin-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: darwin-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - name: Build final Windows installer
        if: runner.os == 'Windows'
        run: npm run package:windows
      - if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles appimage,deb
      - name: Build macOS app archive and DMG
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target "$TARGET" --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Sign and verify final updater artifact
        env:
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ needs.validate.outputs.commit }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: node scripts/stage-update.mjs --directory release-assets --platform "$PLATFORM" --commit "$SOURCE_SHA" --public-key src-tauri/updater.pub
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: marklite-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install pinned Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build ARM64 release APK without a signing key
        run: node scripts/android/build-ci.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-unsigned
          path: android-unsigned/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [validate, build, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: marklite-*
          path: release-assets
          merge-multiple: true
      - name: Verify four signatures and generate latest.json and SHA256SUMS.txt
        env:
          RELEASE_METADATA: ${{ needs.validate.outputs.metadata }}
        run: |
          node -e 'require("node:fs").writeFileSync("release.json", process.env.RELEASE_METADATA)'
          node scripts/assemble-update.mjs --directory release-assets --release release.json --public-key src-tauri/updater.pub
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-desktop-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

# Download both artifacts, sign the APK locally, then assemble and publish with --with-android.
# Android signing keys never enter this workflow.
