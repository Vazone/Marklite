name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust for tooling signature tests
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0

      - name: Public tooling tests
        run: npm run test:tooling

      - name: Audit high-severity npm advisories
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Type and Svelte checks
        run: npm run check

      - name: Frontend unit tests
        run: npm test

      - name: Windows packaging script tests
        run: npm run test:packaging

      - name: Startup diagnostics analyzer tests
        run: npm run test:startup-diagnostics

      - name: Build frontend
        run: npm run build

  backend-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust 1.88
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          components: clippy, rustfmt

      - name: Prepare frontend and Windows CLI build inputs
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust targets with the lock file
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features

      - name: Lint Rust targets
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Test Rust targets
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features
